      "dataset": [
        {
          "@type": "Dataset",

        },
        {
          "@type": "Dataset",
          "name": "TOOL-320K: Hand tool manipulation",
          "description": "Pliers, drivers, shears, and knives held under load.",
          "license": "Research and commercial, per-seat"
        }
      ]
    }

  <body>
    <!--
      THESIS: A dataset company proves itself by showing the instrument, not by claiming
      accuracy. This page refuses the SaaS hero-with-gradient and the three-feature-card
      grid; the capture rig's own output is the artwork.
      OWN-WORLD: Warm near-black #0c0a09 ground, cream #f0e6d3 text, a high-contrast Bodoni
      display with its emphasis line in italic, Archivo body, Azeret Mono for every
      measurement, and acid lime #c8e64a as the single signal. Actions are pills, surfaces
      are 14px, hairlines separate everything else.
      STORY: A researcher sees tracked hand kinematics rendering live, follows capture through
      to shipped tensors, reads real coverage, then requests access.
      FIRST VIEWPORT: Centred column: category pill, two-line serif headline with the second
      line italic, one primary action, four capture assurances, then a full-width framed
      canvas rendering a 21-keypoint hand skeleton in motion.
      FORM: Centred editorial hero into a pinned horizontal pipeline. Direction pinned by the
      user to the warm-dark editorial family, so no concept roll was dealt.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
